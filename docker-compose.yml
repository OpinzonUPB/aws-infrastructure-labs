services:
  app:
    build: .
    image: sizing-app
    ports:
      - "8000:8000"
    # Los experimentos de dimensionamiento (CPU y memoria limitados) se
    # ejecutan con ./scripts/start_container.sh, que usa `docker run` para
    # controlar --cpus y --memory de forma explícita en cada prueba.
    # Este docker-compose.yml es solo un atajo para levantar la app rápido
    # y comprobar que /health responde, sin límites de recursos.
